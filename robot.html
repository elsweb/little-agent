<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ROBOT</title>

<style type="text/css">

html {
    background: black;
}

body {
    background: black;
    color: white;

    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    text-align: center;
}


/* ROBÔ */

.robot {
    display: block;

    width: 100%;

    margin: 0 auto;

    padding-top: 30px;
}


/* ROSTO */

.face {
    display: block;

    width: 280px;
    height: 210px;

    margin: 30px auto 0 auto;

    border: 3px solid cyan;

    border-radius: 45px;

    background: black;
}


/* OLHOS */

.eyes {
    display: block;

    width: 190px;

    margin: 0 auto;

    padding-top: 45px;

    white-space: nowrap;
}


.eye {
    display: inline-block;

    width: 45px;
    height: 45px;

    margin-left: 15px;
    margin-right: 15px;

    background: cyan;

    border-radius: 50%;
}


/* BOCA */

.mouth {
    display: block;

    width: 110px;
    height: 10px;

    margin: 35px auto 0 auto;

    background: cyan;

    border-radius: 8px;
}


/* STATUS */

.status {
    display: block;

    margin-top: 20px;

    color: white;

    font-size: 16px;
}

</style>

</head>


<body>


<span class="robot">


    <span class="face">


        <span class="eyes">


            <span class="eye"></span>

            <span class="eye"></span>


        </span>


        <span class="mouth"></span>


    </span>


    <span class="status">

        AGUARDANDO PYTHON

    </span>


</span>


</body>

</html>
