<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>ROBOT</title>


<style>

html,
body {

    background: black;

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;
}


body {

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;
}


.robot {

    display: block;

    width: 100%;

    padding-top: 30px;
}


.face {

    display: block;

    width: 280px;
    height: 210px;

    margin: 30px auto 0;

    border: 3px solid cyan;

    border-radius: 45px;

    background: black;
}


.eyes {

    display: block;

    width: 190px;

    margin: 0 auto;

    padding-top: 45px;

    white-space: nowrap;
}


.eye {

    display: inline-block;

    width: 45px;
    height: 45px;

    margin-left: 15px;
    margin-right: 15px;

    background: cyan;

    border-radius: 50%;

    transition:
        height 0.08s,
        margin-top 0.08s;
}


.eye.blink {

    height: 4px;

    margin-top: 41px;
}


.mouth {

    display: block;

    width: 110px;
    height: 10px;

    margin: 35px auto 0;

    background: cyan;

    border-radius: 8px;
}


.status {

    display: block;

    margin-top: 20px;

    color: white;

    font-size: 16px;
}

</style>

</head>


<body>


<span class="robot">


    <span class="face">


        <span class="eyes">


            <span
                class="eye"
                id="eye1">
            </span>


            <span
                class="eye"
                id="eye2">
            </span>


        </span>


        <span class="mouth"></span>


    </span>


    <span
        class="status"
        id="status">

        AGUARDANDO PYTHON

    </span>


</span>


<script>


console.log(
    "ROBOT HTML INICIADO"
);


/*
==================================================
PYTHON -> JAVASCRIPT
==================================================
*/

window.robotEvent = function(command) {

    console.log(
        "PYTHON -> JAVASCRIPT:",
        command
    );


    command = String(
        command
    ).toUpperCase();


    if (command === "BLINK") {

        console.log(
            "BLINK RECEBIDO"
        );


        blink();


        return "BLINK OK";
    }


    console.log(
        "COMANDO DESCONHECIDO:",
        command
    );


    return "UNKNOWN";
};


/*
==================================================
BLINK
==================================================
*/

function blink() {

    const eye1 =
        document.getElementById(
            "eye1"
        );


    const eye2 =
        document.getElementById(
            "eye2"
        );


    const status =
        document.getElementById(
            "status"
        );


    console.log(
        "👁️ BLINK"
    );


    eye1.classList.add(
        "blink"
    );


    eye2.classList.add(
        "blink"
    );


    status.innerText =
        "BLINK";


    setTimeout(
        function() {

            eye1.classList.remove(
                "blink"
            );


            eye2.classList.remove(
                "blink"
            );


            status.innerText =
                "AGUARDANDO PYTHON";


            console.log(
                "BLINK FINALIZADO"
            );

        },
        180
    );
}


console.log(
    "robotEvent:",
    typeof window.robotEvent
);

</script>


</body>

</html>
