<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>ROBOT</title>

    <style>
        html,
        body {

            background: black;

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

        }


        body {

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

        }


        .robot {

            display: block;

            width: 100%;

            padding-top: 30px;

        }


        /* ==========================================
           ROSTO
        ========================================== */

        .face {

            display: block;

            width: 280px;
            height: 210px;

            margin: 30px auto 0;

            border: 3px solid cyan;

            border-radius: 45px;

            background: black;

        }


        /* ==========================================
           OLHOS
        ========================================== */

        .eyes {

            display: block;

            width: 190px;

            margin: 0 auto;

            padding-top: 45px;

            white-space: nowrap;

        }


        .eye {

            display: inline-block;

            width: 45px;
            height: 45px;

            margin-left: 15px;
            margin-right: 15px;

            background: cyan;

            border-radius: 50%;

        }


        .eye.blink {

            height: 4px;

            margin-top: 41px;

        }


        /* ==========================================
           BOCA
        ========================================== */

        .mouth {

            display: block;

            width: 110px;
            height: 10px;

            margin: 35px auto 0;

            background: cyan;

            border-radius: 8px;

        }


        /* ==========================================
           STATUS
        ========================================== */

        .status {

            display: block;

            width: 100%;

            margin-top: 20px;

            color: white;

            font-size: 16px;

            line-height: 22px;

            min-height: 22px;

        }


        /* ==========================================
           CAIXA DO GESTO
        ========================================== */

        .gesture-box {

            display: block;

            width: 280px;

            margin: 12px auto 0;

            padding: 12px 10px;

            border: 2px solid cyan;

            background: black;

            color: cyan;

            font-size: 17px;

            font-weight: bold;

            line-height: 22px;

            text-align: center;

            box-sizing: border-box;

        }


        /* ==========================================
           TEXTO DO GESTO
        ========================================== */

        .gesture {

            display: block;

            width: 100%;

            white-space: normal;

        }
    </style>

</head>


<body>


    <span class="robot">


        <!-- ======================================
             ROSTO DO ROBÔ
        ====================================== -->

        <span class="face">


            <span class="eyes">

                <span class="eye" id="eye1">
                </span>


                <span class="eye" id="eye2">
                </span>

            </span>


            <span class="mouth"></span>


        </span>


        <!-- ======================================
             STATUS
        ====================================== -->

        <span class="status" id="status">

            AGUARDANDO PYTHON

        </span>


        <!-- ======================================
             CAIXA DO GESTO
        ====================================== -->

        <span class="gesture-box">

            <span id="gesture" class="gesture">

                GESTO: AGUARDANDO...

            </span>

        </span>


    </span>


    <script>


        console.log(
            "ROBOT HTML INICIADO"
        );


        /* =========================================
           PYTHON -> JAVASCRIPT
        ========================================= */

        window.robotEvent = function (command) {


            console.log(
                "PYTHON -> JAVASCRIPT:",
                command
            );


            command = String(
                command
            ).toUpperCase();


            /* =====================================
               PUNHO
            ===================================== */

            if (command === "FIST") {

                showGesture(
                    "✊ PUNHO DETECTADO"
                );

                return "FIST OK";

            }


            /* =====================================
               MÃO ABERTA
            ===================================== */

            if (command === "OPEN_PALM") {

                showGesture(
                    "🖐 MÃO ABERTA DETECTADA"
                );

                return "OPEN PALM OK";

            }


            /* =====================================
               DESCONHECIDO
            ===================================== */

            if (command === "UNKNOWN") {

                showGesture(
                    "❓ GESTO NÃO RECONHECIDO"
                );

                return "UNKNOWN OK";

            }


            /* =====================================
               BLINK
            ===================================== */

            if (command === "BLINK") {

                blink();

                return "BLINK OK";

            }


            /* =====================================
               FECHAR OLHOS
            ===================================== */

            if (command === "CLOSE_EYES") {

                closeEyes();

                return "EYES CLOSED";

            }


            /* =====================================
               ABRIR OLHOS
            ===================================== */

            if (command === "OPEN_EYES") {

                openEyes();

                return "EYES OPEN";

            }


            /* =====================================
               DOUBLE BLINK
            ===================================== */

            if (command === "DOUBLE_BLINK") {

                doubleBlink();

                return "DOUBLE BLINK OK";

            }


            console.log(
                "COMANDO DESCONHECIDO:",
                command
            );


            return "UNKNOWN";

        };


        /* =========================================
           PEGAR ELEMENTOS
        ========================================= */

        function getElements() {

            return {

                eye1:
                    document.getElementById(
                        "eye1"
                    ),

                eye2:
                    document.getElementById(
                        "eye2"
                    ),

                status:
                    document.getElementById(
                        "status"
                    ),

                gesture:
                    document.getElementById(
                        "gesture"
                    )

            };

        }


        /* =========================================
           MOSTRAR GESTO
        ========================================= */

        function showGesture(texto) {


            var elements =
                getElements();


            if (!elements.gesture) {

                console.log(
                    "ERRO: elemento gesture não encontrado"
                );

                return;

            }


            elements.gesture.innerHTML =
                "GESTO: " + texto;


            console.log(
                "GESTO RECONHECIDO:",
                texto
            );

        }


        /* =========================================
           FECHAR OLHOS
        ========================================= */

        function closeEyes() {


            var elements =
                getElements();


            console.log(
                "OLHOS FECHADOS"
            );


            elements.eye1.classList.add(
                "blink"
            );


            elements.eye2.classList.add(
                "blink"
            );


            elements.status.innerHTML =
                "📷 TIRANDO FOTO...";

        }


        /* =========================================
           ABRIR OLHOS
        ========================================= */

        function openEyes() {


            var elements =
                getElements();


            elements.eye1.classList.remove(
                "blink"
            );


            elements.eye2.classList.remove(
                "blink"
            );


            elements.status.innerHTML =
                "AGUARDANDO PYTHON";


            console.log(
                "OLHOS ABERTOS"
            );

        }


        /* =========================================
           BLINK
        ========================================= */

        function blink() {


            var elements =
                getElements();


            console.log(
                "BLINK"
            );


            elements.eye1.classList.add(
                "blink"
            );


            elements.eye2.classList.add(
                "blink"
            );


            setTimeout(
                function () {


                    elements.eye1.classList.remove(
                        "blink"
                    );


                    elements.eye2.classList.remove(
                        "blink"
                    );


                    console.log(
                        "BLINK FINALIZADO"
                    );


                },
                180
            );

        }


        /* =========================================
           DOUBLE BLINK
        ========================================= */

        function doubleBlink() {


            console.log(
                "DOUBLE BLINK"
            );


            blink();


            setTimeout(
                function () {

                    blink();

                },
                350
            );

        }


        /* =========================================
           READY
        ========================================= */

        console.log(
            "robotEvent:",
            typeof window.robotEvent
        );


    </script>


</body>

</html>
