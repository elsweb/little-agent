<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ROBOT</title>
    <style>
        html,
        body {
            background: black;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .robot {
            display: block;
            width: 100%;
            padding-top: 30px;
        }

        .face {
            display: block;
            width: 280px;
            height: 210px;
            margin: 30px auto 0;
            border: 3px solid cyan;
            border-radius: 45px;
            background: black;
        }

        .eyes {
            display: block;
            width: 190px;
            margin: 0 auto;
            padding-top: 45px;
            white-space: nowrap;
        }

        .eye {
            display: inline-block;
            width: 45px;
            height: 45px;
            margin-left: 15px;
            margin-right: 15px;
            background: cyan;
            border-radius: 50%;
            transition: height 0.08s, margin-top 0.08s;
        }

        .eye.blink {
            height: 4px;
            margin-top: 41px;
        }

        .mouth {
            display: block;
            width: 110px;
            height: 10px;
            margin: 35px auto 0;
            background: cyan;
            border-radius: 8px;
        }

        .status {
            display: block;
            margin-top: 20px;
            color: white;
            font-size: 16px;
            min-height: 22px;
        }
    </style>
</head>

<body>

    <span class="robot">
        <span class="face">
            <span class="eyes">
                <span class="eye" id="eye1"></span>
                <span class="eye" id="eye2"></span>
            </span>
            <span class="mouth"></span>
        </span>

        <span class="status">
            <span id="status">AGUARDANDO PYTHON</span>
            <span id="gesture" class="gesture">GESTO: AGUARDANDO...</span>
        </span>
    </span>

    <script>

        console.log("ROBOT HTML INICIADO");

        /*
        ==================================================
        PYTHON -> JAVASCRIPT
        ==================================================
        */

        window.robotEvent = function (command) {

            console.log("PYTHON -> JAVASCRIPT:", command);

            command = String(command).toUpperCase();

            // ----------------------------------------------
            // GESTO: PUNHO
            // ----------------------------------------------

            if (command === "FIST") {

                showGesture("✊ PUNHO DETECTADO");

                return "FIST OK";
            }

            // ----------------------------------------------
            // GESTO: MÃO ABERTA
            // ----------------------------------------------

            if (command === "OPEN_PALM") {

                showGesture("🖐️ MÃO ABERTA DETECTADA");

                return "OPEN PALM OK";
            }

            // ----------------------------------------------
            // GESTO DESCONHECIDO
            // ----------------------------------------------

            if (command === "UNKNOWN") {

                showGesture("❓ GESTO NÃO RECONHECIDO");

                return "UNKNOWN OK";
            }

            // ----------------------------------------------
            // BLINK
            // ----------------------------------------------

            if (command === "BLINK") {

                blink();

                return "BLINK OK";
            }

            // ----------------------------------------------
            // FECHAR OLHOS
            // ----------------------------------------------

            if (command === "CLOSE_EYES") {

                closeEyes();

                return "EYES CLOSED";
            }

            // ----------------------------------------------
            // ABRIR OLHOS
            // ----------------------------------------------

            if (command === "OPEN_EYES") {

                openEyes();

                return "EYES OPEN";
            }

            // ----------------------------------------------
            // DOIS BLINKS
            // ----------------------------------------------

            if (command === "DOUBLE_BLINK") {

                doubleBlink();

                return "DOUBLE BLINK OK";
            }

            console.log("COMANDO DESCONHECIDO:", command);

            return "UNKNOWN";
        };


        /*
        ==================================================
        PEGAR ELEMENTOS
        ==================================================
        */

        function getEyes() {

            return {
                eye1: document.getElementById("eye1"),
                eye2: document.getElementById("eye2"),
                status: document.getElementById("status")
            };
        }


        /*
        ==================================================
        MOSTRAR GESTO
        ==================================================
        */

        function showGesture(texto) {

            const eyes = getEyes();

            eyes.gesture.innerText =
                "GESTO: " + texto;

            console.log(
                "🤖 GESTO RECONHECIDO:",
                texto
            );
        }


        /*
        ==================================================
        FECHAR OLHOS
        ==================================================
        */

        function closeEyes() {

            const eyes = getEyes();

            console.log("👁️ OLHOS FECHADOS");

            eyes.eye1.classList.add("blink");
            eyes.eye2.classList.add("blink");

            eyes.status.innerText = "📷 TIRANDO FOTO...";
        }


        /*
        ==================================================
        ABRIR OLHOS
        ==================================================
        */

        function openEyes() {

            const eyes = getEyes();

            eyes.eye1.classList.remove("blink");
            eyes.eye2.classList.remove("blink");

            eyes.status.innerText = "AGUARDANDO PYTHON";

            console.log("👁️ OLHOS ABERTOS");
        }


        /*
        ==================================================
        BLINK
        ==================================================
        */

        function blink() {

            const eyes = getEyes();

            console.log(
                "👁️ BLINK"
            );

            eyes.eye1.classList.add(
                "blink"
            );

            eyes.eye2.classList.add(
                "blink"
            );

            setTimeout(
                function () {

                    eyes.eye1.classList.remove(
                        "blink"
                    );

                    eyes.eye2.classList.remove(
                        "blink"
                    );

                    console.log(
                        "BLINK FINALIZADO"
                    );

                },
                180
            );
        }


        /*
        ==================================================
        DOUBLE BLINK
        ==================================================
        */

        function doubleBlink() {

            console.log("👁️👁️ DOUBLE BLINK");

            blink();

            setTimeout(function () {

                blink();

            }, 350);
        }


        /*
        ==================================================
        READY
        ==================================================
        */

        console.log("robotEvent:", typeof window.robotEvent);

    </script>

</body>

</html>
